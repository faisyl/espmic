# ESPMIC audio server compose stack.
#
# Runs a single `server` service from the local image (built with
# `docker compose build`) or from the published image. See README.md.
services:
  server:
    image: ghcr.io/faisyl/espmic-server:latest
    build:
      context: .
      args:
        BUILD_VERSION: "dev"
        GIT_COMMIT: "${GIT_COMMIT:-dev}"
        BUILD_DATE: "${BUILD_DATE:-unknown}"
    restart: unless-stopped
    environment:
      # All tunables (source of truth: internal/config/config.go):
      ESPMIC_HTTP_ADDR: ":8080"
      ESPMIC_CONTROL_ADDR: ":4433"
      # TLS for the control connection — the stack auto-generates a
      # self-signed pair on first start at these paths (persistent volume);
      # empty means plain TCP. Mount your own cert/key at these paths to
      # override (the entrypoint skips generation when both files exist).
      ESPMIC_TLS_CERT: /data/certs/cert.pem
      ESPMIC_TLS_KEY: /data/certs/key.pem
      # ESPMIC_TLS_CN: espmic.local
      ESPMIC_DB_PATH: /data/espmic.db
      ESPMIC_JITTER_TARGET_MS: "60"
      ESPMIC_RTP_WAIT_TIMEOUT_S: "5"
      ESPMIC_LOG_LEVEL: "debug"
      # Fixed UDP port for RTP ingest (bound inside container and published):
      ESPMIC_RTP_BIND_PORT: "5004"
      # Operator sets ESPMIC_ADVERTISE_HOST to the Docker host LAN IP reachable
      # by ESP32 devices (e.g. 192.168.1.100). When empty, defaults to session IP.
      ESPMIC_ADVERTISE_HOST: "10.10.10.151"  # Set to host LAN IP in .env
      ESPMIC_ADVERTISE_RTP_PORT: "${ESPMIC_ADVERTISE_RTP_PORT:-5004}"
    ports:
      - "8080:8080"       # HTTP management API
      - "4433:4433"       # control TLS/TCP
      - "5004:5004/udp"   # RTP UDP ingest
    volumes:
      - espmic-data:/data

# ---- RTP UDP ingest ----------------------------------------------------
# The server binds a fixed RTP UDP port (ESPMIC_RTP_BIND_PORT: 5004) published
# as 5004:5004/udp. Behind Docker/NAT, set ESPMIC_ADVERTISE_HOST to the host LAN
# IP so devices send RTP to the host rather than the container-internal IP.
# Set ESPMIC_ADVERTISE_RTP_PORT if the published host port differs from the container port.
# Alternatively, use host networking:
#   network_mode: host
#   + remove the `ports:` block above

volumes:
  espmic-data:
    name: espmic-data   # holds the SQLite DB (espmic.db) + recordings/
